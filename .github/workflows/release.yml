# Installer builds. Runs when a commit on main has [release] in its message, when a version tag is pushed,
# or from the Actions tab ("Run workflow"). Builds the Mac (universal .dmg/.zip) and Windows (.exe) installers
# and attaches them to a GitHub Release in this repo, where anyone can download them without a GitHub login.
# Game-only updates don't need this: pushing game/, manifest.json and notes.json to main is the update, and
# every installed launcher downloads the changed files the next time it opens (or within the hour).
name: Build & release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/manifest.js
      - name: Build and publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always
